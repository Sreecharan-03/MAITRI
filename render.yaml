# ==============================================================================
# Render Blueprint Specification for MAITRI Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: maitri-backend
    runtime: python
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: "/health"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEVICE
        value: cpu
      - key: GEMINI_API_KEY
        sync: false
