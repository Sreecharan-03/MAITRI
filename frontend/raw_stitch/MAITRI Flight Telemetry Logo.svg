<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rocketGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Hexagonal Tech Ring -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 4" fill="none" opacity="0.6"/>
  <!-- Rotating Sensor Ring -->
  <circle cx="50" cy="50" r="36" stroke="url(#shieldGlow)" stroke-width="1.5" stroke-dasharray="14 6" fill="rgba(6,182,212,0.04)"/>
  <!-- Central Stylized Aerospace Medical Rocket -->
  <g filter="url(#neon)">
    <!-- Rocket Fuselage -->
    <path d="M50,20 C54,32 60,46 60,62 C60,67 56,70 50,70 C44,70 40,67 40,62 C40,46 46,32 50,20 Z" fill="url(#rocketGlow)"/>
    <!-- Wings -->
    <path d="M40,54 L26,68 L37,68 L40,62 Z" fill="#0284c7"/>
    <path d="M60,54 L74,68 L63,68 L60,62 Z" fill="#0284c7"/>
    <!-- Medical Cross Core in Cockpit -->
    <rect x="47.5" y="44" width="5" height="15" rx="1.5" fill="#ffffff"/>
    <rect x="42.5" y="49" width="15" height="5" rx="1.5" fill="#ffffff"/>
    <!-- Thrust Plume Plasma -->
    <path d="M46,71 L50,83 L54,71 Z" fill="#38bdf8" opacity="0.9"/>
    <circle cx="50" cy="85" r="2" fill="#10b981"/>
  </g>
  <!-- Telemetry dots -->
  <circle cx="50" cy="10" r="2" fill="#38bdf8"/>
  <circle cx="88" cy="50" r="2" fill="#06b6d4"/>
  <circle cx="12" cy="50" r="2" fill="#06b6d4"/>
</svg>